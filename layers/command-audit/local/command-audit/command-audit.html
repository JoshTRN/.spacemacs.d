<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command audit</title>
<style>
/* ── design tokens ────────────────────────────────────────────
   Light: the neutral chart palette, magenta data hue (#a017ab).
   Dark:  the functional-contrast-dragonized theme — base #161925,
          solaire #0e1019, signature magenta #c50ed2.
   Both data hues validated against their own surface.          */
.viz-root {
  color-scheme: light;
  --page:           #f4f3f1;
  --surface:        #fcfcfb;
  --surface-2:      #f3eff4;
  --border:         rgba(11,11,11,0.10);
  --border-strong:  rgba(11,11,11,0.16);
  --text-primary:   #14131a;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --grid:           #e6e3e8;
  --baseline:       #c8c4cb;
  --series:         #a017ab;
  --series-wash:    rgba(160,23,171,0.10);
  --series-track:   rgba(160,23,171,0.13);
  --good:           #006300;
  --bad:            #b3261e;
  --shadow:         0 1px 2px rgba(11,11,11,0.05), 0 8px 24px -12px rgba(11,11,11,0.14);
  --ring:           rgba(160,23,171,0.35);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root { color-scheme: dark;
    --page:           #0e1019;
    --surface:        #161925;
    --surface-2:      #1c2030;
    --border:         #2b3147;
    --border-strong:  #3d4460;
    --text-primary:   #d3dae3;
    --text-secondary: #9aa3b2;
    --text-muted:     #767b87;
    --grid:           #232841;
    --baseline:       #2b3147;
    --series:         #c50ed2;
    --series-wash:    rgba(197,14,210,0.16);
    --series-track:   rgba(197,14,210,0.18);
    --good:           #71f79f;
    --bad:            #ed254e;
    --shadow:         0 1px 2px rgba(0,0,0,0.4), 0 12px 32px -16px rgba(0,0,0,0.8);
    --ring:           rgba(197,14,210,0.55);
  }
}
:root[data-theme="dark"] .viz-root { color-scheme: dark;
  --page:           #0e1019;
  --surface:        #161925;
  --surface-2:      #1c2030;
  --border:         #2b3147;
  --border-strong:  #3d4460;
  --text-primary:   #d3dae3;
  --text-secondary: #9aa3b2;
  --text-muted:     #767b87;
  --grid:           #232841;
  --baseline:       #2b3147;
  --series:         #c50ed2;
  --series-wash:    rgba(197,14,210,0.16);
  --series-track:   rgba(197,14,210,0.18);
  --good:           #71f79f;
  --bad:            #ed254e;
  --shadow:         0 1px 2px rgba(0,0,0,0.4), 0 12px 32px -16px rgba(0,0,0,0.8);
  --ring:           rgba(197,14,210,0.55);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body.viz-root {
  margin: 0;
  background: var(--page);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: ui-monospace, "Fira Code", "JetBrains Mono", "SF Mono", Menlo, monospace; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 36px 28px 56px; }

/* ── header ─────────────────────────────────────────────────── */
.masthead { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
.masthead h1 { font-size: 21px; font-weight: 640; letter-spacing: -0.01em; margin: 0; }
.masthead .sub { color: var(--text-secondary); font-size: 13px; margin-top: 3px; }
.masthead .sub .dot { color: var(--text-muted); margin: 0 6px; }
.masthead-actions { display: flex; gap: 8px; flex: none; }

/* ── controls ───────────────────────────────────────────────── */
button, input {
  font: inherit; color: var(--text-secondary);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 9px; padding: 6px 12px;
}
button { cursor: pointer; transition: color .12s, background .12s, border-color .12s; }
button:hover { color: var(--text-primary); border-color: var(--border-strong); }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
  outline: none; box-shadow: 0 0 0 3px var(--ring); border-color: var(--series);
}
.icon-btn { display: inline-flex; align-items: center; gap: 7px; }
.icon-btn svg { width: 14px; height: 14px; flex: none; }

.controls {
  display: flex; flex-direction: column; gap: 10px;
  padding: 11px 13px; margin-bottom: 20px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: var(--shadow);
}
.ctl-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ctl-row + .ctl-row { border-top: 1px solid var(--border); padding-top: 10px; }
.seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button {
  border: none; background: transparent; border-radius: 8px;
  padding: 5px 11px; font-size: 12.5px; line-height: 1.3;
}
.seg button[aria-pressed="true"] {
  background: var(--surface); color: var(--text-primary); font-weight: 600;
  box-shadow: 0 1px 2px rgba(0,0,0,0.10);
}
.ctl-sep { width: 1px; align-self: stretch; background: var(--border); margin: 2px 2px; }
.ctl-label { color: var(--text-muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12.5px; padding: 5px 11px; border-radius: 999px; }
.chip .count { color: var(--text-muted); font-variant-numeric: tabular-nums; margin-left: 5px; font-size: 11.5px; }
.chip[aria-pressed="true"] {
  background: var(--series-wash); border-color: var(--series);
  color: var(--text-primary); font-weight: 600;
}
.chip[aria-pressed="true"] .count { color: var(--text-secondary); }

.search { position: relative; margin-left: auto; }
.search input { padding: 6px 28px 6px 30px; width: 190px; border-radius: 999px; color: var(--text-primary); }
.search input::placeholder { color: var(--text-muted); }
.search .glass { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; color: var(--text-muted); pointer-events: none; }
.search .clear {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  border: none; background: transparent; padding: 4px 6px; border-radius: 999px;
  line-height: 1; font-size: 15px; color: var(--text-muted);
}
.search .clear[hidden] { display: none; }

/* ── cards ──────────────────────────────────────────────────── */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 20px 22px; box-shadow: var(--shadow);
}
.card + .card, .grid { margin-top: 18px; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
.card-head h2 { font-size: 13.5px; font-weight: 640; margin: 0; letter-spacing: -0.005em; }
.card-head .sub { color: var(--text-secondary); font-size: 12px; margin-top: 2px; }
.grid { display: grid; grid-template-columns: minmax(0,1.85fr) minmax(0,1fr); gap: 18px; align-items: start; }

/* ── hero + daily ───────────────────────────────────────────── */
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 4px; }
.hero-figure .label { color: var(--text-secondary); font-size: 12.5px; }
.hero-figure .value {
  font-size: 52px; font-weight: 640; line-height: 1.02; letter-spacing: -0.025em;
  margin-top: 2px; color: var(--text-primary);
}
.hero-figure .delta { font-size: 12.5px; margin-top: 5px; color: var(--text-secondary); }
.hero-figure .delta b { font-weight: 640; }
.delta.up b { color: var(--good); } .delta.down b { color: var(--bad); }
.hero-stats { display: flex; gap: 28px; flex-wrap: wrap; padding-bottom: 4px; }
.hero-stats .stat .label { color: var(--text-muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.hero-stats .stat .value { font-size: 19px; font-weight: 600; margin-top: 1px; }
.hero-stats .stat .value small { font-size: 12.5px; font-weight: 500; color: var(--text-secondary); margin-left: 2px; }

/* ── charts ─────────────────────────────────────────────────── */
svg.chart { display: block; width: 100%; overflow: visible; }
svg.chart .grid-line { stroke: var(--grid); stroke-width: 1; }
svg.chart .axis-line { stroke: var(--baseline); stroke-width: 1; }
svg.chart .tick { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg.chart .col { fill: var(--series); pointer-events: none; }
svg.chart .col.ghost { fill: var(--series-track); }
svg.chart .hit { fill: transparent; cursor: default; }
/* adjacent, not general: each hit is immediately followed by its own column */
svg.chart .hit:hover + .col, svg.chart .hit:focus-visible + .col { filter: brightness(1.18) saturate(1.05); }
svg.chart .hit:focus-visible { outline: 2px solid var(--series); outline-offset: -2px; }

/* ── ranked bars ────────────────────────────────────────────── */
.bars { display: flex; flex-direction: column; gap: 2px; }
.more {
  margin-top: 10px; width: 100%; font-size: 12.5px; padding: 7px 12px;
  background: var(--surface-2); border-color: transparent; color: var(--text-secondary);
}
.more:hover { color: var(--text-primary); }
.bar-row {
  display: grid; grid-template-columns: minmax(120px, 258px) minmax(0,1fr) 46px;
  align-items: center; gap: 12px; width: 100%;
  background: transparent; border: 1px solid transparent; border-radius: 9px;
  padding: 4px 8px; text-align: left; color: inherit;
}
.bar-row:hover { background: var(--surface-2); border-color: transparent; }
.bar-row[aria-pressed="true"] { background: var(--series-wash); border-color: var(--series); }
.bar-row .name {
  font-size: 12.5px; color: var(--text-secondary); text-align: right;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl;
}
.bar-row[aria-pressed="true"] .name, .bar-row:hover .name { color: var(--text-primary); }
.bar-row .track { position: relative; height: 16px; }
.bar-row .fill {
  position: absolute; inset: 0 auto 0 0; background: var(--series);
  border-radius: 0 4px 4px 0; min-width: 3px;
}
.bar-row:hover .fill { filter: brightness(1.15) saturate(1.05); }
.bar-row .val { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--text-secondary); text-align: right; }
.bar-row[aria-pressed="true"] .val { color: var(--text-primary); font-weight: 600; }

/* ── detail panel ───────────────────────────────────────────── */
.detail-name { font-size: 13px; word-break: break-all; line-height: 1.35; color: var(--text-primary); }
.detail-badge {
  display: inline-block; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
  font-weight: 650; color: var(--text-muted); margin-bottom: 6px;
}
.meter { margin: 14px 0 16px; }
.meter-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.meter-head b { color: var(--text-primary); font-size: 15px; font-weight: 640; }
.meter-track { height: 8px; border-radius: 999px; background: var(--series-track); overflow: hidden; }
.meter-fill { height: 100%; background: var(--series); border-radius: 999px; min-width: 3px; }
.detail-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; margin-bottom: 16px; }
.detail-stats .k { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.detail-stats .v { font-size: 14px; font-weight: 600; margin-top: 1px; }
.detail-stats .v small { font-weight: 500; color: var(--text-secondary); font-size: 12px; }
.spark-label { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; margin-bottom: 6px; }

/* ── tables ─────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; color: var(--text-muted); font-weight: 600; font-size: 11px;
     text-transform: uppercase; letter-spacing: .06em; white-space: nowrap;
     border-bottom: 1px solid var(--baseline); padding: 7px 10px; }
td { border-bottom: 1px solid var(--grid); padding: 7px 10px; color: var(--text-primary); }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--surface-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

.empty { color: var(--text-muted); text-align: center; padding: 28px 12px; font-size: 13px; }
footer { color: var(--text-muted); font-size: 11.5px; margin-top: 20px; display: flex; gap: 14px; flex-wrap: wrap; }
footer .mono { color: var(--text-secondary); }

/* ── tooltip ────────────────────────────────────────────────── */
#tip {
  position: fixed; z-index: 30; pointer-events: none; opacity: 0; transform: translateY(2px);
  transition: opacity .1s ease, transform .1s ease;
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: 10px; padding: 9px 13px; box-shadow: var(--shadow); max-width: 330px;
}
#tip.on { opacity: 1; transform: none; }
#tip .v { font-size: 16px; font-weight: 640; color: var(--text-primary); letter-spacing: -0.01em; }
#tip .l { font-size: 12px; color: var(--text-secondary); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
#tip .key { width: 10px; height: 2px; border-radius: 2px; background: var(--series); flex: none; }

#live { opacity: 1; transition: opacity .15s; }
#live.loading { opacity: .45; }

@media (max-width: 900px) {
  .grid { grid-template-columns: minmax(0,1fr); }
  .search { margin-left: 0; width: 100%; }
  .search input { width: 100%; }
}
@media (max-width: 560px) {
  .wrap { padding: 22px 16px 40px; }
  .hero-figure .value { font-size: 40px; }
  .bar-row { grid-template-columns: minmax(90px,140px) minmax(0,1fr) 40px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body class="viz-root">
<div class="wrap">

  <header class="masthead">
    <div>
      <h1>Command audit</h1>
      <div class="sub" id="masthead-sub">Interactive command usage, tallied per day</div>
    </div>
    <div class="masthead-actions">
      <button id="refresh" class="icon-btn" type="button" title="Refetch the log from Emacs">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 8a6 6 0 1 1-1.8-4.3M14 2v4h-4"/>
        </svg>Refresh</button>
      <button id="theme" type="button">Auto</button>
    </div>
  </header>

  <div class="controls" role="group" aria-label="Filters">
    <div class="ctl-row">
      <span class="ctl-label">Range</span>
      <div class="seg" id="ranges" role="group" aria-label="Date range">
        <button type="button" data-days="7">7 days</button>
        <button type="button" data-days="30">30 days</button>
        <button type="button" data-days="90">90 days</button>
        <button type="button" data-days="all">All time</button>
      </div>
      <div class="search">
        <svg class="glass" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/>
        </svg>
        <input id="search" type="search" placeholder="Filter commands…  /" aria-label="Filter commands by name" autocomplete="off">
        <button class="clear" id="search-clear" type="button" aria-label="Clear filter" hidden>×</button>
      </div>
    </div>
    <div class="ctl-row" id="prefix-row">
      <span class="ctl-label" id="prefix-label">Prefix</span>
      <div class="chips" id="prefixes" role="group" aria-labelledby="prefix-label"></div>
    </div>
  </div>

  <div id="live">
    <section class="card">
      <div class="hero">
        <div class="hero-figure">
          <div class="label" id="hero-label">Invocations</div>
          <div class="value" id="hero-value">–</div>
          <div class="delta" id="hero-delta"></div>
        </div>
        <div class="hero-stats">
          <div class="stat"><div class="label">Commands</div><div class="value" id="stat-commands">–</div></div>
          <div class="stat"><div class="label">Active days</div><div class="value" id="stat-days">–</div></div>
          <div class="stat"><div class="label">Per active day</div><div class="value" id="stat-rate">–</div></div>
          <div class="stat"><div class="label">Busiest</div><div class="value" id="stat-peak">–</div></div>
        </div>
      </div>
      <div id="daily-chart"></div>
      <div id="daily-table" hidden></div>
      <div class="card-head" style="margin: 14px 0 0; align-items: center;">
        <div class="sub" id="daily-caption">Invocations per day</div>
        <div class="seg" role="group" aria-label="Daily activity view">
          <button type="button" data-view="chart" data-card="daily" aria-pressed="true">Chart</button>
          <button type="button" data-view="table" data-card="daily" aria-pressed="false">Table</button>
        </div>
      </div>
    </section>

    <div class="grid">
      <section class="card">
        <div class="card-head">
          <div>
            <h2>Most-used commands</h2>
            <div class="sub" id="bars-caption">Select a command to inspect it</div>
          </div>
          <div class="seg" role="group" aria-label="Commands view">
            <button type="button" data-view="chart" data-card="commands" aria-pressed="true">Chart</button>
            <button type="button" data-view="table" data-card="commands" aria-pressed="false">Table</button>
          </div>
        </div>
        <div id="commands-chart"></div>
        <div id="commands-table" hidden></div>
      </section>

      <section class="card" id="detail-card">
        <div class="card-head"><div><h2>Detail</h2></div></div>
        <div id="detail"></div>
      </section>
    </div>
  </div>

  <footer>
    <span id="foot-log"></span>
    <span id="foot-targets"></span>
    <span id="foot-time"></span>
  </footer>
</div>

<div id="tip" role="status" aria-live="polite"></div>

<script id="audit-data" type="application/json">__COMMAND_AUDIT_DATA__</script>
<script id="audit-meta" type="application/json">__COMMAND_AUDIT_META__</script>
<script>
"use strict";

/* ═══ data ═══════════════════════════════════════════════════ */
const readJSON = (id, fallback) => {
  const text = document.getElementById(id).textContent.trim();
  if (text.startsWith("__")) return fallback;            // unrendered template
  try { return JSON.parse(text); } catch (e) { return fallback; }
};

let RAW = readJSON("audit-data", {});                    // {cmd: {day: n}}
let META = readJSON("audit-meta", { prefixes: [], targets: [], logFile: "", generated: "" });

let allDates = [], anchor = null;
function indexDates() {
  allDates = [...new Set(Object.values(RAW).flatMap(d => Object.keys(d)))].sort();
  anchor = allDates.length ? allDates[allDates.length - 1] : null;
}
indexDates();

/* ═══ helpers ════════════════════════════════════════════════ */
const fmt = n => n.toLocaleString("en-US");
const compact = n => n < 10000 ? fmt(n)
  : n < 1e6 ? (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K"
  : (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
const parseDay = s => new Date(s + "T00:00:00");
const dayStr = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const shortDay = s => parseDay(s).toLocaleDateString("en-US", { month: "short", day: "numeric" });
const longDay = s => parseDay(s).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return dayStr(d); };
const plural = (n, w) => `${fmt(n)} ${w}${n === 1 ? "" : "s"}`;
const clear = n => { while (n.firstChild) n.removeChild(n.firstChild); };
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;          // labels are untrusted data
  return e;
};
const SVGNS = "http://www.w3.org/2000/svg";
const sv = (tag, attrs) => {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
};
function niceStep(max, ticks) {
  const rough = max / ticks, mag = Math.pow(10, Math.floor(Math.log10(rough || 1)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * mag >= rough) return m * mag;
  return 10 * mag;
}
/* rounded cap at the data end, square at the baseline */
const colPath = (x, yTop, w, h) => {
  const r = Math.max(0, Math.min(4, w / 2, h));
  return `M${x},${yTop + r} a${r},${r} 0 0 1 ${r},-${r} h${w - 2 * r} a${r},${r} 0 0 1 ${r},${r} v${h - r} h${-w} Z`;
};

/* ═══ state ══════════════════════════════════════════════════ */
const state = { range: 30, prefix: "all", query: "", selected: null, showAll: false,
                view: { commands: "chart", daily: "chart" } };
const BAR_LIMIT = 18;                                    // head of the ranked list

function windowDays() {
  if (!anchor) return [];
  let first = state.range === "all" ? allDates[0] : addDays(anchor, -(state.range - 1));
  if (first < allDates[0]) first = allDates[0];
  const out = [];
  for (let d = first; d <= anchor; d = addDays(d, 1)) out.push(d);
  return out;
}
/* the equally-long window immediately before, for the delta */
function priorDays() {
  const days = windowDays();
  if (!days.length || state.range === "all") return [];
  const out = [];
  for (let i = days.length; i > 0; i--) out.push(addDays(days[0], -i));
  return out.filter(d => d >= allDates[0]);
}

const prefixOf = cmd => {
  let best = null;
  for (const p of META.prefixes || []) {
    if (cmd.startsWith(p) && (!best || p.length > best.length)) best = p;
  }
  return best || "other";
};
const matchesFilters = cmd =>
  (state.prefix === "all" || prefixOf(cmd) === state.prefix) &&
  (!state.query || cmd.toLowerCase().includes(state.query));

/* Aggregate the log over DAYS, keeping only commands that pass the
   prefix + search filters. */
function aggregate(days, { filtered = true } = {}) {
  const inRange = new Set(days);
  const commands = [];
  const byDay = new Map(days.map(d => [d, { total: 0, top: null, topN: 0 }]));
  let total = 0;
  for (const cmd in RAW) {
    if (filtered && !matchesFilters(cmd)) continue;
    let sum = 0, active = 0, peakDay = null, peakN = 0, first = null, last = null;
    const per = {};
    for (const d in RAW[cmd]) {
      if (!inRange.has(d)) continue;
      const n = RAW[cmd][d];
      per[d] = n; sum += n; active++;
      if (n > peakN) { peakN = n; peakDay = d; }
      if (!first || d < first) first = d;
      if (!last || d > last) last = d;
      const agg = byDay.get(d);
      agg.total += n;
      if (n > agg.topN) { agg.topN = n; agg.top = cmd; }
    }
    if (sum > 0) { commands.push({ cmd, total: sum, per, active, peakDay, peakN, first, last }); total += sum; }
  }
  commands.sort((a, b) => b.total - a.total || a.cmd.localeCompare(b.cmd));
  return { commands, byDay, total };
}

/* ═══ tooltip ════════════════════════════════════════════════ */
const tip = document.getElementById("tip");
function showTip(lines, x, y) {                          // lines[0] = value (strong)
  clear(tip);
  tip.appendChild(el("div", "v", lines[0]));
  for (const line of lines.slice(1)) {
    if (!line) continue;
    const row = el("div", "l");
    if (line.key) row.appendChild(el("span", "key"));
    row.appendChild(el("span", null, line.text !== undefined ? line.text : line));
    tip.appendChild(row);
  }
  tip.classList.add("on");
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(x + 14, innerWidth - r.width - 8)) + "px";
  tip.style.top = Math.max(8, Math.min(y + 16, innerHeight - r.height - 8)) + "px";
}
const hideTip = () => tip.classList.remove("on");
function bindTip(node, linesFn) {
  node.addEventListener("pointermove", e => showTip(linesFn(), e.clientX, e.clientY));
  node.addEventListener("pointerleave", hideTip);
  node.addEventListener("focus", () => {
    const r = node.getBoundingClientRect();
    showTip(linesFn(), r.left + r.width / 2 - 40, r.bottom - 8);
  });
  node.addEventListener("blur", hideTip);
}

/* ═══ hero + summary ═════════════════════════════════════════ */
function renderHero(days, agg) {
  const active = [...agg.byDay.values()].filter(d => d.total > 0);
  document.getElementById("hero-value").textContent = compact(agg.total);
  document.getElementById("hero-label").textContent =
    state.prefix === "all" && !state.query ? "Invocations" : "Invocations (filtered)";
  document.getElementById("stat-commands").textContent = fmt(agg.commands.length);
  document.getElementById("stat-days").textContent = fmt(active.length);

  const rate = active.length ? agg.total / active.length : 0;
  document.getElementById("stat-rate").textContent =
    active.length ? (Math.round(rate * 10) / 10).toLocaleString("en-US") : "–";

  let peak = null;
  for (const [d, v] of agg.byDay) if (!peak || v.total > peak.total) peak = { day: d, total: v.total };
  const peakEl = document.getElementById("stat-peak");
  clear(peakEl);
  if (peak && peak.total > 0) {
    peakEl.appendChild(document.createTextNode(shortDay(peak.day)));
    const s = el("small", null, ` ${fmt(peak.total)}`);
    peakEl.appendChild(s);
  } else peakEl.textContent = "–";

  const deltaEl = document.getElementById("hero-delta");
  clear(deltaEl);
  deltaEl.className = "delta";
  const prior = priorDays();
  const priorTotal = prior.length ? aggregate(prior).total : 0;
  if (prior.length && priorTotal > 0) {
    const pct = ((agg.total - priorTotal) / priorTotal) * 100;
    const up = pct >= 0;
    deltaEl.classList.add(up ? "up" : "down");
    const b = el("b", null, `${up ? "▲" : "▼"} ${Math.abs(pct).toFixed(0)}%`);
    deltaEl.appendChild(b);
    deltaEl.appendChild(document.createTextNode(
      ` vs previous ${days.length === 1 ? "day" : plural(days.length, "day")}`));
  } else if (days.length) {
    deltaEl.appendChild(document.createTextNode(
      `${shortDay(days[0])} – ${shortDay(days[days.length - 1])}`));
  }
}

/* ═══ daily activity ═════════════════════════════════════════ */
function renderDaily(days, agg) {
  const host = document.getElementById("daily-chart");
  clear(host);
  const max = Math.max(0, ...days.map(d => agg.byDay.get(d).total));
  if (!days.length || max === 0) { host.appendChild(el("div", "empty", "No usage in this range.")); return; }

  const W = Math.max(320, host.clientWidth || 720);
  const plotH = 150, axisH = 24, padTop = 10, padL = 38, padR = 6;
  const H = padTop + plotH + axisH, plotW = W - padL - padR;
  const svg = sv("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, width: W, height: H,
                          role: "img", "aria-label": `Invocations per day, ${days.length} days` });

  const step = niceStep(max, 3), yMax = Math.ceil(max / step) * step;
  const y = v => padTop + plotH - (v / yMax) * plotH;
  for (let v = step; v <= yMax + 1e-9; v += step) {
    svg.appendChild(sv("line", { class: "grid-line", x1: padL, x2: W - padR, y1: y(v), y2: y(v) }));
    const t = sv("text", { class: "tick", x: padL - 8, y: y(v) + 3.5, "text-anchor": "end" });
    t.textContent = fmt(Math.round(v));
    svg.appendChild(t);
  }
  svg.appendChild(sv("line", { class: "axis-line", x1: padL, x2: W - padR, y1: y(0), y2: y(0) }));

  const band = plotW / days.length;
  const colW = Math.max(3, Math.min(26, band - Math.max(2, band * 0.32)));  // 2px+ surface gap
  const every = Math.ceil(days.length / Math.max(3, Math.floor(plotW / 78)));
  days.forEach((d, i) => {
    const cx = padL + band * i + band / 2;
    if (i % every === 0 || i === days.length - 1) {
      const t = sv("text", { class: "tick", x: cx, y: padTop + plotH + 16, "text-anchor": "middle" });
      t.textContent = shortDay(d);
      svg.appendChild(t);
    }
    const info = agg.byDay.get(d), n = info.total;
    const hit = sv("rect", { class: "hit", x: padL + band * i, y: padTop, width: band, height: plotH,
                             tabindex: 0, role: "img",
                             "aria-label": `${longDay(d)}: ${plural(n, "invocation")}` });
    bindTip(hit, () => [
      plural(n, "invocation"),
      { text: longDay(d), key: true },
      info.top ? `Top: ${info.top} (${fmt(info.topN)})` : null,
    ]);
    svg.appendChild(hit);
    if (n > 0) {
      const h = y(0) - y(n);
      svg.appendChild(sv("path", { class: "col", d: colPath(cx - colW / 2, y(n), colW, h) }));
    }
  });
  host.appendChild(svg);

  document.getElementById("daily-caption").textContent =
    `Invocations per day · ${shortDay(days[0])} – ${shortDay(days[days.length - 1])}`;
}

/* ═══ ranked commands ════════════════════════════════════════ */
function renderBars(agg) {
  const host = document.getElementById("commands-chart");
  clear(host);
  const caption = document.getElementById("bars-caption");
  if (!agg.commands.length) {
    host.appendChild(el("div", "empty",
      state.query || state.prefix !== "all" ? "No commands match these filters." : "No usage in this range."));
    caption.textContent = "Select a command to inspect it";
    return;
  }
  // Show a head of the ranked list; the tail is one click (or the table) away.
  const selectedRank = agg.commands.findIndex(c => c.cmd === state.selected);
  const expanded = state.showAll || selectedRank >= BAR_LIMIT;
  const shown = expanded ? agg.commands : agg.commands.slice(0, BAR_LIMIT);
  const hidden = agg.commands.length - shown.length;
  // The table twin is never capped, so only the chart advertises a cap.
  caption.textContent = hidden > 0 && state.view.commands === "chart"
    ? `Top ${shown.length} of ${agg.commands.length} · select one to inspect it`
    : `${plural(agg.commands.length, "command")} · select one to inspect it`;

  const max = agg.commands[0].total;
  const list = el("div", "bars");
  for (const c of shown) {
    const row = el("button", "bar-row");
    row.type = "button";
    row.setAttribute("aria-pressed", String(state.selected === c.cmd));
    const name = el("div", "name mono", c.cmd);
    name.title = c.cmd;
    const track = el("div", "track");
    const fill = el("div", "fill");
    fill.style.width = Math.max(2, (c.total / max) * 100) + "%";
    track.appendChild(fill);
    row.append(name, track, el("div", "val", fmt(c.total)));
    row.addEventListener("click", () => {
      state.selected = state.selected === c.cmd ? null : c.cmd;
      render();
    });
    bindTip(row, () => [
      plural(c.total, "invocation"),
      { text: c.cmd, key: true },
      `${((c.total / agg.total) * 100).toFixed(1)}% of the filtered total`,
      c.peakDay ? `Peak ${fmt(c.peakN)} on ${shortDay(c.peakDay)}` : null,
    ]);
    list.appendChild(row);
  }
  host.appendChild(list);

  if (hidden > 0 || expanded) {
    const more = el("button", "more", hidden > 0
      ? `Show ${plural(hidden, "more command")}`
      : `Show top ${BAR_LIMIT}`);
    more.type = "button";
    more.addEventListener("click", () => {
      state.showAll = hidden > 0;
      if (!state.showAll && selectedRank >= BAR_LIMIT) state.selected = null;
      render();
    });
    host.appendChild(more);
  }
}

/* ═══ detail panel ═══════════════════════════════════════════ */
function renderDetail(days, agg) {
  const host = document.getElementById("detail");
  clear(host);
  if (!agg.commands.length) { host.appendChild(el("div", "empty", "Nothing to inspect.")); return; }

  const chosen = agg.commands.find(c => c.cmd === state.selected);
  const c = chosen || agg.commands[0];
  host.appendChild(el("div", "detail-badge", chosen ? "Selected" : "Top command"));
  host.appendChild(el("div", "detail-name mono", c.cmd));

  const share = agg.total ? (c.total / agg.total) * 100 : 0;
  const meter = el("div", "meter");
  const head = el("div", "meter-head");
  const left = el("div");
  left.appendChild(el("b", null, fmt(c.total)));
  left.appendChild(document.createTextNode(" invocations"));
  head.append(left, el("div", null, `${share.toFixed(1)}% of shown`));
  const mtrack = el("div", "meter-track");
  const mfill = el("div", "meter-fill");
  mfill.style.width = Math.max(1.5, share) + "%";
  mtrack.appendChild(mfill);
  meter.append(head, mtrack);
  host.appendChild(meter);

  const stats = el("div", "detail-stats");
  const perActive = c.active ? (Math.round((c.total / c.active) * 10) / 10).toLocaleString("en-US") : "–";
  const pairs = [
    ["Active days", fmt(c.active)],
    ["Per active day", perActive],
    ["Peak", c.peakDay ? `${fmt(c.peakN)}` : "–", c.peakDay ? ` on ${shortDay(c.peakDay)}` : ""],
    ["Last used", c.last ? shortDay(c.last) : "–"],
  ];
  for (const [k, v, extra] of pairs) {
    const cell = el("div");
    cell.appendChild(el("div", "k", k));
    const val = el("div", "v", v);
    if (extra) val.appendChild(el("small", null, extra));
    cell.appendChild(val);
    stats.appendChild(cell);
  }
  host.appendChild(stats);

  host.appendChild(el("div", "spark-label", "Daily"));
  host.appendChild(sparkline(days, c));
}

function sparkline(days, c) {
  const W = 300, H = 62, pad = 2;
  const max = Math.max(1, ...days.map(d => c.per[d] || 0));
  const svg = sv("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none",
                          role: "img", "aria-label": `Daily invocations of ${c.cmd}` });
  const band = W / Math.max(1, days.length);
  const colW = Math.max(2, Math.min(18, band - Math.max(2, band * 0.3)));
  days.forEach((d, i) => {
    const n = c.per[d] || 0;
    const x = band * i + (band - colW) / 2;
    const h = n > 0 ? Math.max(2, (n / max) * (H - pad * 2)) : 2;
    const cls = n > 0 ? "col" : "col ghost";
    const node = sv("path", { class: cls, d: colPath(x, H - pad - h, colW, h) });
    node.appendChild(sv("title", {})).textContent = `${longDay(d)}: ${plural(n, "invocation")}`;
    svg.appendChild(node);
  });
  svg.appendChild(sv("line", { class: "axis-line", x1: 0, x2: W, y1: H - pad, y2: H - pad }));
  return svg;
}

/* ═══ tables (the WCAG-clean twin of every chart) ════════════ */
function table(headers, rows) {
  const wrap = el("div", "table-wrap");
  const t = el("table");
  const thead = el("thead"), htr = el("tr");
  headers.forEach(([label, num]) => htr.appendChild(el("th", num ? "num" : null, label)));
  thead.appendChild(htr);
  const tbody = el("tbody");
  for (const cells of rows) {
    const tr = el("tr");
    cells.forEach((cell, i) => {
      const td = el("td", headers[i][1] ? "num" : null);
      if (headers[i][2]) td.classList.add("mono");
      td.textContent = cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
  t.append(thead, tbody);
  wrap.appendChild(t);
  return wrap;
}

function renderTables(days, agg) {
  const cmdHost = document.getElementById("commands-table");
  clear(cmdHost);
  cmdHost.appendChild(agg.commands.length
    ? table([["Command", false, true], ["Total", true], ["Share", true], ["Active days", true], ["Peak", true], ["Peak day", false]],
            agg.commands.map(c => [c.cmd, fmt(c.total),
              `${agg.total ? ((c.total / agg.total) * 100).toFixed(1) : "0.0"}%`,
              fmt(c.active), fmt(c.peakN), c.peakDay ? shortDay(c.peakDay) : "–"]))
    : el("div", "empty", "No commands match these filters."));

  const dayHost = document.getElementById("daily-table");
  clear(dayHost);
  const rows = days.filter(d => agg.byDay.get(d).total > 0).reverse()
    .map(d => { const v = agg.byDay.get(d);
                return [longDay(d), fmt(v.total), v.top ? `${v.top} (${fmt(v.topN)})` : "–"]; });
  dayHost.appendChild(rows.length
    ? table([["Date", false], ["Invocations", true], ["Top command", false, true]], rows)
    : el("div", "empty", "No usage in this range."));
}

/* ═══ prefix chips — built from the prefixes Emacs resolved ══ */
function renderPrefixChips() {
  const host = document.getElementById("prefixes");
  clear(host);
  const days = new Set(windowDays());
  const counts = new Map();
  for (const cmd in RAW) {
    let n = 0;
    for (const d in RAW[cmd]) if (days.has(d)) n += RAW[cmd][d];
    if (!n) continue;
    const p = prefixOf(cmd);
    counts.set(p, (counts.get(p) || 0) + n);
  }
  const known = (META.prefixes || []).filter(p => counts.has(p));
  const options = [["all", "All", [...counts.values()].reduce((a, b) => a + b, 0)]];
  for (const p of known) options.push([p, p, counts.get(p)]);
  if (counts.has("other")) options.push(["other", "other", counts.get("other")]);

  // A lone prefix plus "All" is a distinction without a difference.
  const show = options.length > 2;
  document.getElementById("prefix-row").hidden = !show;
  if (!show) { if (state.prefix !== "all") state.prefix = "all"; return; }

  if (!options.some(o => o[0] === state.prefix)) state.prefix = "all";
  for (const [key, label, n] of options) {
    const chip = el("button", key === "all" ? "chip" : "chip mono");
    chip.type = "button";
    chip.setAttribute("aria-pressed", String(state.prefix === key));
    chip.appendChild(document.createTextNode(label));
    chip.appendChild(el("span", "count", compact(n)));
    chip.addEventListener("click", () => {
      state.prefix = key;
      if (state.selected && !matchesFilters(state.selected)) state.selected = null;
      render();
    });
    host.appendChild(chip);
  }
}

/* ═══ render ═════════════════════════════════════════════════ */
function render() {
  renderPrefixChips();
  const days = windowDays();
  const agg = aggregate(days);
  if (state.selected && !agg.commands.some(c => c.cmd === state.selected)) state.selected = null;
  renderHero(days, agg);
  renderDaily(days, agg);
  renderBars(agg);
  renderDetail(days, agg);
  renderTables(days, agg);

  const sub = document.getElementById("masthead-sub");
  clear(sub);
  sub.appendChild(document.createTextNode(
    anchor ? `Interactive command usage through ${longDay(anchor)}` : "Interactive command usage, tallied per day"));
  if ((META.targets || []).length) {
    sub.appendChild(el("span", "dot", "·"));
    sub.appendChild(document.createTextNode(`auditing ${META.targets.join(", ")}`));
  }
}

/* ═══ controls ═══════════════════════════════════════════════ */
const rangeButtons = [...document.querySelectorAll("#ranges button")];
function setRange(v) {
  state.range = v === "all" ? "all" : Number(v);
  rangeButtons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.days === String(v))));
  render();
}
rangeButtons.forEach(b => b.addEventListener("click", () => setRange(b.dataset.days)));

document.querySelectorAll(".seg button[data-view]").forEach(b => {
  b.addEventListener("click", () => {
    const { card, view } = b.dataset;
    document.querySelectorAll(`.seg button[data-card="${card}"]`)
      .forEach(o => o.setAttribute("aria-pressed", String(o === b)));
    document.getElementById(`${card}-chart`).hidden = view !== "chart";
    document.getElementById(`${card}-table`).hidden = view !== "table";
    state.view[card] = view;
    render();                                            // charts need a live width
  });
});

const search = document.getElementById("search");
const searchClear = document.getElementById("search-clear");
search.addEventListener("input", () => {
  state.query = search.value.trim().toLowerCase();
  searchClear.hidden = !search.value;
  if (state.selected && !matchesFilters(state.selected)) state.selected = null;
  render();
});
searchClear.addEventListener("click", () => {
  search.value = ""; state.query = ""; searchClear.hidden = true; search.focus(); render();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.selected) { state.selected = null; render(); }
  else if (e.key === "/" && document.activeElement !== search) { e.preventDefault(); search.focus(); }
});

/* theme: auto → light → dark */
const themeBtn = document.getElementById("theme");
const THEMES = ["auto", "light", "dark"];
const readTheme = () => { try { return localStorage.getItem("command-audit-theme") || "auto"; } catch (e) { return "auto"; } };
function applyTheme(t) {
  if (t === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  themeBtn.textContent = t[0].toUpperCase() + t.slice(1);
  themeBtn.title = `Theme: ${t} (click to change)`;
  try { localStorage.setItem("command-audit-theme", t); } catch (e) {}
}
themeBtn.addEventListener("click", () => applyTheme(THEMES[(THEMES.indexOf(readTheme()) + 1) % THEMES.length]));
applyTheme(readTheme());

/* refresh: refetch the log, holding the previous render (no skeleton flash) */
const live = document.getElementById("live");
const refreshBtn = document.getElementById("refresh");
refreshBtn.addEventListener("click", async () => {
  live.classList.add("loading");
  try {
    const res = await fetch("data.json", { cache: "no-store" });
    const payload = await res.json();
    if (payload && payload.data) {
      RAW = payload.data;
      if (payload.meta) META = payload.meta;
      indexDates();
      render();
      renderFooter();
    }
  } catch (e) { /* keep showing the last good render */ }
  live.classList.remove("loading");
});

function renderFooter() {
  const log = document.getElementById("foot-log");
  clear(log);
  log.appendChild(document.createTextNode("Log "));
  log.appendChild(el("span", "mono", META.logFile || "—"));
  document.getElementById("foot-targets").textContent =
    (META.prefixes || []).length ? `Prefixes ${META.prefixes.join(", ")}` : "";
  document.getElementById("foot-time").textContent =
    META.generated ? `Served by Emacs at ${META.generated.replace("T", " ")}` : "Served by Emacs";
}

let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 140); });

renderFooter();
setRange(30);
</script>
</body>
